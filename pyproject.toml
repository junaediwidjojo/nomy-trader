[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nomy-trader"
version = "0.1.0"
description = "Offline domain foundation for educational buy-side recommendations"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
